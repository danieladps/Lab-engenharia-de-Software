services:
  db:
    image: postgres:16-alpine
    container_name: petlume-db
    environment:
      POSTGRES_DB: petlume
      POSTGRES_USER: petlume
      # Senhas e chaves vêm do arquivo .env na raiz (copie de .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Só este computador acessa o banco.
      - "127.0.0.1:5432:5432"
    networks:
      - petlume-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlume -d petlume"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petlume-backend
    environment:
      DATABASE_URL: postgresql://petlume:${POSTGRES_PASSWORD}@db:5432/petlume
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_DATA: "true"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja .env.example)}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - petlume-network
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed_demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petlume-frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - petlume-network

volumes:
  postgres_data:

networks:
  petlume-network:
    driver: bridge
