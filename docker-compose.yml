services:
  db:
    image: postgres:16-alpine
    container_name: petlume-db
    environment:
      POSTGRES_DB: petlume
      POSTGRES_USER: petlume
      POSTGRES_PASSWORD: petlume123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - petlume-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlume -d petlume"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petlume-backend
    environment:
      DATABASE_URL: postgresql://petlume:petlume123@db:5432/petlume
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_DATA: "true"
      JWT_SECRET: "petlume-chave-local-desenvolvimento-123456"
      DEMO_USER_PASSWORD: "PetLume123"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - petlume-network
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed_demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petlume-frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - petlume-network

volumes:
  postgres_data:

networks:
  petlume-network:
    driver: bridge
