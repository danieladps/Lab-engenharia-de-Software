# Roda os testes da API e o lint/build do site a cada pull request e a cada push na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes
        # A chave dos testes é gerada no conftest.py; nenhum segredo real é usado aqui.
        run: python -m pytest -q

  frontend:
    name: Site (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
